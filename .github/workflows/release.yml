name: Release

# Publishes a launcher release every TV updates itself to (Updater, config.xml update_url), from what is on main.
# Started by launcher/release.sh or from the Actions tab. The release key lives only in this repository's secrets
# (RELEASE_KEYSTORE_B64, RELEASE_KEY_PASSWORD), so no particular computer is needed to release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "versionName, e.g. 1.8 (empty: the next one)"
        required: false
        default: ""
      notes:
        description: "What changed (the TVs show it)"
        required: false
        default: ""
      dry_run:
        description: "Build and check only, publish nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # SHA-256 of the release certificate every TV now trusts; a build signed otherwise is never published.
      SIGNER: 9637c1905c84de9833fbf4b998ccadcd1911d9ec1ba260dbc1215540e4da821a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4

      - name: Release key
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "RELEASE_KEYSTORE_B64 is not set"; exit 1; }
          mkdir -p ~/.tv-launcher && chmod 700 ~/.tv-launcher
          printf '%s' "$KEYSTORE" | base64 -d > ~/.tv-launcher/release.jks
          chmod 600 ~/.tv-launcher/release.jks

      - name: Version
        id: v
        working-directory: launcher
        env:
          WANTED: ${{ inputs.version }}
        run: |
          CODE=$(( $(sed -n 's/^ *versionCode \([0-9]*\)$/\1/p' app/build.gradle) + 1 ))
          LAST=$(sed -n "s/^ *versionName '\([^']*\)'$/\1/p" app/build.gradle)
          VERSION=${WANTED:-$(printf '%s' "$LAST" | awk -F. '{print $1"."$2+1}')}
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)+$' || { echo "bad version: $VERSION"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then echo "v$VERSION is already released"; exit 1; fi
          sed -i "s/^\( *versionCode \)[0-9]*$/\1$CODE/; s/^\( *versionName \)'[^']*'$/\1'$VERSION'/" app/build.gradle
          grep -q "versionCode $CODE" app/build.gradle
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION ($CODE)"

      - name: New TVs start from the owner's settings
        run: python3 -I tools/make-defaults.py

      - name: Build
        working-directory: launcher
        env:
          TV_LAUNCHER_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Signed with the release key
        run: |
          APK=launcher/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          grep -q "certificate SHA-256 digest: $SIGNER" /tmp/certs.txt || { echo "not signed with the release key"; exit 1; }

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          CODE: ${{ steps.v.outputs.code }}
          NOTES: ${{ inputs.notes }}
        run: |
          OUT=$(mktemp -d)
          cp launcher/app/build/outputs/apk/release/app-release.apk "$OUT/tv-launcher.apk"
          NOTES=${NOTES:-"Launcher $VERSION"}
          python3 - "$OUT" <<'PY'
          import hashlib, json, os, sys
          out = sys.argv[1]
          apk = os.path.join(out, "tv-launcher.apk")
          v = os.environ["VERSION"]
          info = {"versionCode": int(os.environ["CODE"]), "versionName": v,
                  "apk": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/v{v}/tv-launcher.apk",
                  "sha256": hashlib.sha256(open(apk, "rb").read()).hexdigest(), "notes": os.environ["NOTES"]}
          json.dump(info, open(os.path.join(out, "update.json"), "w"), ensure_ascii=False)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher/app/build.gradle launcher/app/src/main/assets/defaults.json
          git commit -q -m "launcher $VERSION (versionCode $CODE)"
          git tag "v$VERSION"
          git push -q origin HEAD:main "v$VERSION"
          gh release create "v$VERSION" --title "TV Launcher $VERSION" --notes "$NOTES" \
            "$OUT/tv-launcher.apk" "$OUT/update.json"
          echo "Released $VERSION ($CODE): TVs pick it up within an hour."

      - name: Forget the key
        if: always()
        run: rm -rf ~/.tv-launcher
