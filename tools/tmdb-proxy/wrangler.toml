name = "tv-launcher-tmdb"
main = "worker.js"
compatibility_date = "2026-10-01"
account_id = "175aa69489121cb4274c780bc5195f18"   # Cloudflare account "Basic"
workers_dev = true

[observability]
enabled = true

# The AI routes (ai.js): per-address limit, so the public URL cannot be used to spend the Sentra (Claude) allowance.
[[ratelimits]]
name = "AI_LIMIT"
namespace_id = "1001"
simple = { limit = 12, period = 60 }

# The TMDB proxy: per-address limit on requests that miss the cache, so the public URL cannot spend the token.
[[ratelimits]]
name = "TMDB_LIMIT"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

# Account sign-in (account.js): per-address limit on PIN tries.
[[ratelimits]]
name = "ACCOUNT_LIMIT"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

# Accounts and their synced Home (account.js).
[[kv_namespaces]]
binding = "ACCOUNTS"
id = "6e74394e0755459494f2678a18b530d9"

[vars]
SENTRA_URL = "https://sentra.sntr.workers.dev"
