plugins {
    id 'com.android.application'
}

// The top shelf's TMDB requests go through the tv-launcher-tmdb Worker (config.xml tmdb_proxy, tools/tmdb-proxy), which
// holds the key, so builds carry none. tmdb.key=... in launcher/local.properties (git ignores it) is what
// tools/tmdb-proxy/deploy.sh hands the Worker; tmdb.embed_key=true puts it in the APK instead, for a fork without
// a Worker. Neither: no posters.
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
def tmdbKey = localProps.getProperty('tmdb.embed_key') == 'true' ? (localProps.getProperty('tmdb.key') ?: '').trim() : ''

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 41
        versionName '2.40'
        buildConfigField 'String', 'TMDB_KEY', '"' + tmdbKey.replace('"', '') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
